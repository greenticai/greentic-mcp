name: Nightly coverage

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `greenticai/.github` has no `ci.yml` — that filename only ever existed as
  # this repo's own `.github/workflows/ci.yml`. Referencing it under the org
  # path made the whole workflow unresolvable, so GitHub rejected it at
  # startup: every scheduled run since 2026-04-10 finished in 0s with
  # `total_count: 0` jobs and no logs, and `workflow_dispatch` was refused with
  # HTTP 422. The coverage job below has therefore never executed once.
  #
  # `host-crate-ci.yml` is the org's host-crate CI reusable and the target used
  # by all three other repos carrying this same `setup`-gate shape
  # (greentic-i18n, greentic-setup, greentic-distributor-client). Its defaults
  # resolve to exactly the clippy/test invocations this repo's own green
  # `ci.yml` already runs via `pr-ci.yml` with `variant: host`
  # (`--workspace --all-targets --all-features -- -D warnings` and
  # `--workspace --all-features`), so no `with:` block is needed.
  setup:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    secrets: inherit

  coverage:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: 1.91.0
      - name: Install cargo binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install coverage tooling
        # binstall resolves prebuilt artifacts through api.github.com. Anonymous
        # requests are rate-limited per runner IP, and on a 403 binstall does not
        # fail: it silently degrades to the `compile` strategy, i.e.
        # `cargo install <tool>` WITHOUT --locked. cargo-nextest ships a
        # deliberate compile_error! that rejects exactly that build, so the real
        # rate-limit failure surfaces much later as a confusing compile error.
        # GITHUB_TOKEN lifts the rate limit; --disable-strategies compile makes
        # any remaining resolution failure loud and immediate instead of silent.
        # Root-caused and fixed the same way in greenticai/greentic-cap PR #39.
        #
        # greentic-dev provides the `greentic-dev coverage` wrapper the final
        # step invokes. It was never installed here — the startup failure above
        # meant that was never observable. Every sibling repo binstalls it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry: GitHub release downloads intermittently time out / return 504
          # (run 42466848820 failed before any test ran). Retry up to 3 times
          # with 20s then 40s backoff; fail with the last exit code.
          attempt=1
          until cargo binstall --no-confirm --disable-strategies compile \
            cargo-llvm-cov cargo-nextest greentic-dev; do
            rc=$?
            if [ "$attempt" -ge 3 ]; then
              echo "cargo binstall failed after $attempt attempts" >&2
              exit "$rc"
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          command -v cargo-llvm-cov
          command -v cargo-nextest
          command -v greentic-dev
      - name: Run coverage
        run: greentic-dev coverage
